name: yaalu
description: "Yaalu - Casual Dating & Social Discovery App for Sri Lanka and Global Diaspora"
publish_to: 'none'
version: 1.0.11+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  provider: ^6.1.2
  
  # Network & Realtime
  http: ^1.2.2
  socket_io_client: ^3.0.1
  
  # Security & Storage
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  
  # UI & Animation Components
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  flutter_card_swiper: ^7.0.0
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  path_provider_android: 2.2.15
  path_provider_foundation: 2.4.2

flutter:
  uses-material-design: true
